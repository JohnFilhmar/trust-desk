# What: the three staff users every test starts with, one per group.
# Convention: a YAML file in test/fixtures/ named after a table. Rails loads
#   it into that table before the tests run. Each top-level key is a label,
#   and a test reads the row with staff_users(:enforcer).
# Closest equivalent: a Django fixture, a seed file that a Jest global setup
#   loads.
#
# Rails runs this file through ERB before it reads the YAML, comments
# included. So the password hash below can be computed in Ruby, and no
# comment in this file may contain an ERB tag.
#
# The lowest bcrypt cost keeps the tests fast. Rails fills in the id,
# created_at and updated_at.

viewer:
  email: viewer@example.com
  display_name: Demo Viewer
  password_digest: <%= BCrypt::Password.create("trust-desk-demo-2026", cost: BCrypt::Engine::MIN_COST) %>
  group_name: viewer

analyst:
  email: analyst@example.com
  display_name: Demo Analyst
  password_digest: <%= BCrypt::Password.create("trust-desk-demo-2026", cost: BCrypt::Engine::MIN_COST) %>
  group_name: analyst

enforcer:
  email: enforcer@example.com
  display_name: Demo Enforcer
  password_digest: <%= BCrypt::Password.create("trust-desk-demo-2026", cost: BCrypt::Engine::MIN_COST) %>
  group_name: enforcer
