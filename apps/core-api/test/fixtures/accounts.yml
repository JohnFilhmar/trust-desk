# What: the accounts every test starts with, one active and one suspended.
# Convention: a YAML file in test/fixtures/ named after a table. A test reads
#   a row with accounts(:active_account).
# Closest equivalent: a Django fixture, a seed file that a Jest global setup
#   loads.
#
# signup_context is a JSON column. It is written as a YAML mapping, which
# Rails stores as a JSON object. The data is synthetic: the emails are on
# example.com and the IPs are in the documentation ranges of RFC 5737.

active_account:
  email: fixture-active@example.com
  status: active
  plan: free
  signup_context:
    ip: "192.0.2.10"
    country: US
    user_agent: "Mozilla/5.0 (X11; Linux x86_64) Gecko/20100101 Firefox/130.0"
    device_fingerprint: "0f1e2d3c4b5a69788796a5b4c3d2e1f0"
    referral:

suspended_account:
  email: fixture-suspended@example.com
  status: suspended
  plan: pro
  signup_context:
    ip: "198.51.100.20"
    country: DE
    user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) Safari/605.1.15"
    device_fingerprint: "a1b2c3d4e5f60718293a4b5c6d7e8f90"
    referral: partner-blog
