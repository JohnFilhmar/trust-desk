# nginx inside the web container. It serves the static build and nothing else.
# TLS, /api routing and the security headers belong to nginx on the host.

server {
  # 8080, not 80: the container runs as a user that cannot bind low ports.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A single-page app has one real file. Any path the browser asks for that
  # is not a file, such as /accounts/42 after a refresh, gets index.html.
  location / {
    try_files $uri /index.html;
  }

  # Built assets carry a hash in their name, so they can be cached for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
