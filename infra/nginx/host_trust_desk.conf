# nginx on the HOST, for trust.filhmar.online only.
#
# Install as /etc/nginx/sites-available/trust.filhmar.online and link it
# into sites-enabled. It is a file of its own. It does not touch the server
# block of any other site on this machine.
#
# The certificate is issued with `certbot certonly`, so certbot writes the
# certificate files and edits nothing in nginx.
#
# The two upstream ports must match WEB_HOST_PORT and HANDLERS_HOST_PORT in
# the .env beside docker-compose.prod.yml. They point at the ports the
# containers publish on 127.0.0.1, never at a port nginx itself listens on.

limit_req_zone $binary_remote_addr zone=trust_desk_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=trust_desk_api:1m rate=20r/s;

server {
  listen 80;
  listen [::]:80;
  server_name trust.filhmar.online;

  # certbot answers the certificate challenge from this folder.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://trust.filhmar.online$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name trust.filhmar.online;

  ssl_certificate     /etc/letsencrypt/live/trust.filhmar.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trust.filhmar.online/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:trust_desk_ssl:2m;
  ssl_session_timeout 1d;

  server_tokens off;
  client_max_body_size 1m;

  # `always` adds the header to error responses too.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  # Scripts, fonts, images and requests come from this origin only.
  # style-src allows inline style attributes because Radix sets them to
  # position its dialogs and menus. It allows no inline script.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location = /api/login {
    limit_req zone=trust_desk_login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/trust_desk_proxy.conf;
    proxy_pass http://127.0.0.1:18787;
  }

  location /api/ {
    limit_req zone=trust_desk_api burst=40 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/trust_desk_proxy.conf;
    proxy_pass http://127.0.0.1:18787;
  }

  location / {
    include /etc/nginx/snippets/trust_desk_proxy.conf;
    proxy_pass http://127.0.0.1:18080;
  }
}
