# Shared by every location of trust.filhmar.online.
# Install as /etc/nginx/snippets/trust_desk_proxy.conf.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;

# `$remote_addr` is the address nginx saw the connection come from. Setting
# the header here replaces whatever the browser sent under the same name,
# so a visitor cannot choose the IP the login throttle counts them under.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;

# The handlers give Rails 3 seconds. nginx gives the handlers a little more.
proxy_connect_timeout 3s;
proxy_read_timeout 10s;
proxy_send_timeout 10s;

# Error pages of the containers are passed on as they are. The handlers
# already answer every failure with the generic error envelope.
proxy_intercept_errors off;
