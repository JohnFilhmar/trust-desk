name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to a branch cancels the run of the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm audit --prod
      - run: pnpm run build

  rails:
    name: Rails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-api
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: trust_desk_test
      DB_TEST_NAME: trust_desk_test
      DB_USERNAME: td_admin
      DB_PASSWORD: ci-only-not-a-secret
      DB_CORE_API_USERNAME: td_core_api
      DB_HANDLERS_USERNAME: td_handlers
      SERVICE_HMAC_SECRET: ci-only-not-a-secret-0123456789abcdef
      SHARED_FIXTURES_DIR: ${{ github.workspace }}/packages/shared/fixtures
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-not-a-secret
          MYSQL_DATABASE: trust_desk_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-only-not-a-secret --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: MariaDB client, for db/structure.sql
        # The same client family the Rails image uses. db/structure.sql is
        # written by the MariaDB dump tool and starts with a comment that
        # Oracle's mysql client rejects. The client config turns off
        # certificate checks, as the image does, since the MySQL service
        # signs its own certificate.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-client default-libmysqlclient-dev
          printf '[client]\nssl-verify-server-cert = off\n' > ~/.my.cnf
      - name: Database users
        # db/structure.sql names td_admin as the definer of the audit
        # triggers, so that user must exist before the schema is loaded.
        working-directory: .
        run: |
          mariadb --protocol=tcp -h 127.0.0.1 -uroot -pci-only-not-a-secret -e "
            CREATE USER IF NOT EXISTS 'td_admin'@'%' IDENTIFIED BY 'ci-only-not-a-secret';
            GRANT ALL PRIVILEGES ON *.* TO 'td_admin'@'%' WITH GRANT OPTION;
            CREATE USER IF NOT EXISTS 'td_core_api'@'%' IDENTIFIED BY 'ci-only-not-a-secret';
            CREATE USER IF NOT EXISTS 'td_handlers'@'%' IDENTIFIED BY 'ci-only-not-a-secret';"
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/core-api
          bundler-cache: true
      - run: bin/rubocop
      - run: bin/brakeman --no-pager
      - run: bin/bundler-audit check --update
      - run: bin/rails db:test:prepare
      - run: bin/rails test
