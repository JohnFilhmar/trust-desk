name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to a branch cancels the run of the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm audit --prod
      - run: pnpm run build

  rails:
    name: Rails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-api
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: trust_desk_test
      DB_TEST_NAME: trust_desk_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-not-a-secret
      DB_CORE_API_USERNAME: td_core_api
      DB_HANDLERS_USERNAME: td_handlers
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-not-a-secret
          MYSQL_DATABASE: trust_desk_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-only-not-a-secret --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: MySQL client, for db/structure.sql
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends default-mysql-client default-libmysqlclient-dev
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/core-api
          bundler-cache: true
      - run: bin/rubocop
      - run: bin/brakeman --no-pager
      - run: bin/bundler-audit check --update
      - run: bin/rails db:test:prepare
      - run: bin/rails test
